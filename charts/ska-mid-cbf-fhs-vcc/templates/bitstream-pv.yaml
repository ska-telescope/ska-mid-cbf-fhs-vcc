{{- if .Values.bitstreamPv.enabled }}
{{- $labels := coalesce .Values.global.labels .Values.labels "label:none" }}
{{- $annotations := coalesce .Values.global.annotations .Values.annotations }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fhs-bitstream-pv
  namespace: {{ .Release.Namespace }}
  labels:
{{ toYaml $labels | indent 4 }}
{{- if $annotations }}
  annotations:
{{ toYaml $annotations | indent 4 }}
{{- end }}
spec:
{{- if (coalesce .Values.cbf_kube .Values.global.minikube .Values.minikube false)  }}
  storageClassName: standard
{{- else }}
  storageClassName: nfss1
{{- end }}
  accessModes:
  {{- if .Values.global.cbf_kube }}
    - ReadWriteOnce
  {{- else }}
    - ReadWriteMany
  {{- end }}
  resources:
    requests:
      storage: "1Gi"
{{- end }}
