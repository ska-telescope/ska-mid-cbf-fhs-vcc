[project]
name = "ska-mid-cbf-fhs-vcc"
version = "0.6.4"
description = "SKA Mid.CBF FHS VCC"
authors = [
  { name = "Jason Turner", email = "jason.turner@mda.space" },
  { name = "Ben Herriott", email = "ben.herriott@mda.space" },
  { name = "Justin Wamback", email = "justin.wamback@mda.space" },
]
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "dataclasses-json >= 0.6.7, < 0.7",
  "grpcio >= 1.62.0, < 2",
  "grpcio-health-checking >= 1.62.0, < 2",
  "grpcio-tools >= 1.62.0, < 2",
  "jsonschema >= 4.26.0, < 5",
  "protobuf >= 6.33.0, < 7.0.0",
  "ska-tango-testing == 0.10.0",
  "ska-mid-cbf-fhs-common == 0.6.1",
  "ska-mid-cbf-common == 0.2.14",
  "ska-mid-cbf-fhs-vcc-grpc-controller == 0.0.5",
]

[project.scripts]
FhsVccStackDeviceServer = "ska_mid_cbf_fhs_vcc.fhs_vcc_stack_device_server:main"
SimVCCAllBandsController = "ska_mid_cbf_fhs_vcc.vcc_all_bands.vcc_sim:main"

[dependency-groups]
dev = [
  "pytest == 9.1.1",
  "pytest-cov >= 7.1.0, < 8",
  "pytest-forked >= 1.6.0, < 2",
  "pytest-json-report >= 1.5.0, < 2",
  "pytest-xdist >= 3.8.0, < 4",
  "ruff >= 0.16.8, < 1",
  "twine >= 1.15.0, < 2",
]

docs = [
  "myst-parser >= 4.0.1",
  "ruff >= 0.16.8, < 1",
  "ska-ser-sphinx-theme >= 0.2.1, < 1",
  "sphinx >= 8, < 9",
  "sphinx_collapse >= 0.1.3, < 1",
  "sphinxcontrib-apidoc >= 0.6.0, < 1",
  "sphinxcontrib-mermaid >= 0.9.2, < 1",
  "sphinxcontrib-plantuml >= 0.26, < 1",
]

[tool.uv]
package = true
default-groups = "all"
constraint-dependencies = [
  "certifi >= 2026.10.23",
  "requests >= 2.32.4, < 3",
  "scipy >= 1.18.1, < 2",
  "ska-ser-skuid < 5.3",
]

[tool.uv.sources]
# Official tagged release from CAR
ska-mid-cbf-fhs-common = { index = "ska-nexus" }
# Commit hash version from Gitlab
# ska-mid-cbf-fhs-common = { index = "gitlab-fhs-common" }

# Official tagged release from CAR
ska-mid-cbf-common = { index = "ska-nexus" }
# Commit hash version from Gitlab
# ska-mid-cbf-common = { index = "gitlab-mid-cbf-common" }

# Official tagged release from CAR
ska-mid-cbf-fhs-vcc-grpc-controller = { index = "ska-nexus" }
# Commit hash version from Gitlab
# ska-mid-cbf-fhs-vcc-grpc-controller = { index = "gitlab-fhs-vcc-grpc-controller" }

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.uv.index]]
name = "gitlab-fhs-common"
url = "https://gitlab.com/api/v4/projects/66141956/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-mid-cbf-common"
url = "https://gitlab.com/api/v4/projects/75387241/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-fhs-vcc-grpc-controller"
url = "https://gitlab.com/api/v4/projects/81959427/packages/pypi/simple"

[[tool.uv.index]]
name = "PyPI-public"
url = "https://pypi.org/simple"

[tool.hatch.build.targets.sdist]
include = ["src/ska_mid_cbf_fhs_vcc"]

[tool.hatch.build.targets.wheel]
include = ["src/ska_mid_cbf_fhs_vcc"]

[tool.hatch.build.targets.wheel.sources]
"src/ska_mid_cbf_fhs_vcc" = "ska_mid_cbf_fhs_vcc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
