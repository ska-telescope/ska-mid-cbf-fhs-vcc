[project]
name = "ska-mid-cbf-fhs-vcc"
version = "0.4.2"
description = "SKA Mid.CBF FHS VCC"
authors = [
    { name = "Jason Turner", email = "jason.turner@mda.space" },
    { name = "Ben Herriott", email = "ben.herriott@mda.space" },
    { name = "Justin Wamback", email = "justin.wamback@mda.space" },
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dataclasses-json>=0.6.7,<0.7",
    "debugpy>=1.8.5,<2",
    "grpcio>=1.62.0,<2",
    "grpcio-health-checking>=1.62.0,<2",
    "grpcio-tools>=1.62.0,<2",
    "jsonschema>=4.26.0,<5",
    "protobuf>=6.33.0,<7.0.0",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32.3,<3",
    "ska-tango-testing==0.9.0",
    "ska-telmodel==1.33.0",
    "ska-ser-log-transactions==0.2.2",
    "ska-ser-skuid==5.2.0",
    "typing-extensions>=4.8.0,<5",
    "ska-mid-cbf-fhs-common==0.4.0",
    "ska-mid-cbf-common==0.2.7",
    "ska-mid-cbf-fhs-vcc-grpc-controller==0.0.4",
]

[project.scripts]
FhsVccStackDeviceServer = "ska_mid_cbf_fhs_vcc.fhs_vcc_stack_device_server:main"
SimVCCAllBandsController = "ska_mid_cbf_fhs_vcc.vcc_all_bands.vcc_sim:main"

[dependency-groups]
dev = [
    "black>=24.2.0,<25",
    "flake8>=7.0.0,<8",
    "flake8-quotes>=3.4.0,<4",
    "flake8-annotations>=3.0.1,<4",
    "flake8-import-conventions==0.1.0",
    "flake8-pep585==0.1.7",
    "flake8-bugbear==24.12.12",
    "pylint==3.2.6",
    "pylint-junit==0.3.4",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-forked>=1.6.0,<2",
    "pytest-json-report>=1.5.0,<2",
    "pytest-xdist>=3.8.0,<4",
    "twine>=1.15.0,<2",
]
docs = [
    "black>=24.2.0,<25",
    "flake8>=7.0.0,<8",
    "myst-parser>=4.0.1,<5",
    "ska-ser-sphinx-theme>=0.2.1,<0.3",
    "sphinx>=8,<9",
    "sphinx_collapse>=0.1.3,<0.2",
    "sphinxcontrib-apidoc>=0.6.0,<0.7",
    "sphinxcontrib-mermaid>=0.9.2,<0.10",
    "sphinxcontrib-plantuml>=0.26,<0.27",
]
ci = ["build>=1.4.4,<2"]

[tool.uv]
default-groups = "all"

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.uv.index]]
name = "gitlab-fhs-common"
url = "https://gitlab.com/api/v4/projects/66141956/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-mid-cbf-common"
url = "https://gitlab.com/api/v4/projects/75387241/packages/pypi/simple"

[[tool.uv.index]]
name = "gitlab-fhs-vcc-grpc-controller"
url = "https://gitlab.com/api/v4/projects/81959427/packages/pypi/simple"

[[tool.uv.index]]
name = "PyPI-public"
url = "https://pypi.org/simple"

[tool.uv.sources]
ska-mid-cbf-fhs-common = { index = "ska-nexus" }
ska-mid-cbf-common = { index = "ska-nexus" }
ska-mid-cbf-fhs-vcc-grpc-controller = { index = "ska-nexus" }

[tool.hatch.build.targets.sdist]
include = ["src/ska_mid_cbf_fhs_vcc"]

[tool.hatch.build.targets.wheel]
include = ["src/ska_mid_cbf_fhs_vcc"]

[tool.hatch.build.targets.wheel.sources]
"src/ska_mid_cbf_fhs_vcc" = "ska_mid_cbf_fhs_vcc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.black]
line-length = 130
