[project]
name = "ska-mid-cbf-fhs-vcc"
version = "0.4.0"
description = "SKA Mid.CBF FHS VCC"
authors = [
  { name = "Jason Turner", email = "jason.turner@mda.space" },
  { name = "Ben Herriott", email = "ben.herriott@mda.space" },
  { name = "Justin Wamback", email = "justin.wamback@mda.space" },
]
license = "BSD license"
readme = "README.md"

[project.scripts]
FhsVccStackDeviceServer = 'ska_mid_cbf_fhs_vcc.fhs_vcc_stack_device_server:main'
SimVCCAllBandsController = 'ska_mid_cbf_fhs_vcc.vcc_all_bands.vcc_sim:main'

[tool.poetry]
packages = [{ include = "ska_mid_cbf_fhs_vcc", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
dataclasses-json = "^0.6.7"
debugpy = "^1.8.5"
pyyaml = "^6.0.3"
requests = "^2.32.3"
ska-tango-testing = "0.9.0"
ska-telmodel = "1.33.0"
ska-ser-log-transactions = "0.2.2"
ska-ser-skuid = "5.2.0"
typing-extensions = "^4.8.0"

# Uncomment one of the below to get ska-mid-cbf-fhs-common from one of three sources:
# Official tagged release from CAR
# ska-mid-cbf-fhs-common = { version = "0.3.6", source = "ska-nexus" }
# Commit hash version from Gitlab
ska-mid-cbf-fhs-common = { version = "0.4.0+dev.c293d96af", source = "gitlab-fhs-common" }
# Local repository
# ska-mid-cbf-fhs-common = { path = "../ska-mid-cbf-fhs-common", develop = true }

# Official tagged release from CAR
ska-mid-cbf-common = { version = "0.2.5", source = "ska-nexus" }
# Commit hash version from Gitlab
# ska-mid-cbf-common = { version = "0.0.2+dev.c0642f5d5", source = "gitlab-mid-cbf-common" }
# Local repository
# ska-mid-cbf-common = { path = "../ska-mid-cbf-common", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
flake8 = "^7.0.0"
flake8-quotes = "^3.4.0"
flake8-annotations = "^3.0.1"
flake8-import-conventions = "0.1.0"
flake8-pep585 = "0.1.7"
flake8-bugbear = "24.12.12"
pylint = "3.2.6"
pylint-junit = "0.3.4"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-forked = "^1.6.0"
pytest-json-report = "^1.5.0"
pytest-xdist = "^3.8.0"

[tool.poetry.group.docs.dependencies]
black = "^24.2.0"
flake8 = "^7.0.0"
myst-parser = "^4.0.1"
ska-ser-sphinx-theme = "^0.2.1"
sphinx = "^8"
sphinx_collapse = "^0.1.3"
sphinxcontrib-apidoc="^0.6.0"
sphinxcontrib-mermaid = "^0.9.2"
sphinxcontrib-plantuml = "^0.26"

[[tool.poetry.source]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.poetry.source]]
name="gitlab-fhs-common"
url = "https://gitlab.com/api/v4/projects/66141956/packages/pypi/simple"

[[tool.poetry.source]]
name="gitlab-mid-cbf-common"
url = "https://gitlab.com/api/v4/projects/75387241/packages/pypi/simple"

[[tool.poetry.source]]
name = "PyPI-public"
url = "https://pypi.org/simple"

[tool.isort]
profile = "black"

[tool.black]
line-length = 130

[build-system]
requires = ["poetry>=2.0", "poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"
