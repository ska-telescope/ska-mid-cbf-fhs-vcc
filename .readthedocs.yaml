# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

  apt_packages:
   - plantuml # Add apt packages that you need present in the container here, for example plantuml
  jobs:
    post_create_environment:
      - pip install uv

    post_install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen --only-group docs
      - rm -rf docs/src/_code/ska_mid_cbf_fhs_vcc/*.rst
      - uv run sphinx-apidoc -t docs/src/_templates -o docs/src/_code/ska_mid_cbf_fhs_vcc -M -f -d 2 src/ska_mid_cbf_fhs_vcc/

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/src/conf.py
